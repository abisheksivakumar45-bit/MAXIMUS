[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses function calls in argument defaults by design.
"app/api/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
